name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AstrBot and pytest
        run: |
          python -m pip install --upgrade pip
          pip install "astrbot==4.29.4" pytest pytest-asyncio
      - name: Validate plugin structure
        run: python3 scripts/validate_plugin.py
      - name: Run tests
        run: python -m pytest -q
        env:
          # Keep the read-only rsrs probes off CI; stub tests cover the rest.
          RSRS_TEST_SKIP_REAL: "1"

  release:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: ./scripts/package.sh
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
